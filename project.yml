name: MyApp
options:
  bundleIdPrefix: com.example

settings:
  base:
    GENERATE_INFOPLIST_FILE: YES

targets:
  MyApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources/App]
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
  
  MyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources/UITests]
    dependencies:
      - target: MyApp
