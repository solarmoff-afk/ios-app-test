name: MyApp
options:
  bundleIdPrefix: com.example
targets:
  MyApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [Sources/App]
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
  
  MyAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Sources/UITests]
    dependencies:
      - target: MyApp
