name: iOS Screenshot Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Boot Simulator in Background
      run: |
        xcrun simctl boot "iPhone 16" &
        
    - name: Install XcodeGen and xcparse (Fast mode)
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
        brew install xcodegen
        brew install chargepoint/xcparse/xcparse

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Run UI Tests on iPhone Simulator
      run: |
        xcodebuild test \
          -project MyApp.xcodeproj \
          -scheme MyApp \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          -resultBundlePath TestResults.xcresult \
          COMPILER_INDEX_STORE_ENABLE=NO
          
    - name: Extract Screenshots from xcresult
      if: always()
      run: |
        mkdir -p Screenshots
        xcparse screenshots TestResults.xcresult Screenshots/

    - name: Upload Screenshots as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-screenshots
        path: Screenshots/
        retention-days: 7
