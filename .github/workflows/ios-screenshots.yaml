name: iOS Screenshot Tests

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Позволяет запускать Action вручную из интерфейса GitHub

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install XcodeGen and xcparse
      run: |
        brew install xcodegen
        brew install chargepoint/xcparse/xcparse

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Run UI Tests on iPhone Simulator
      run: |
        xcodebuild test \
          -project MyApp.xcodeproj \
          -scheme MyApp \
          -destination 'platform=iOS Simulator,name=iPhone 15' \
          -resultBundlePath TestResults.xcresult

    - name: Extract Screenshots from xcresult
      if: always()
      run: |
        mkdir -p Screenshots
        # Утилита xcparse достает картинки из бинарного файла результатов Apple
        xcparse screenshots TestResults.xcresult Screenshots/

    - name: Upload Screenshots as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-screenshots
        path: Screenshots/
